name: Pinned canonical DEX prerequisites
description: Verify compiler ownership and qualify ICK before the existing host acceptance path
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: isomorphisms/android-NDK
        ref: 08bcb26a4530c1e68835f93c281f3a3a4ff4a77b
        path: .deps/android-NDK
        persist-credentials: false
    - name: Qualify ICK for native bootstrap stages
      id: ick
      uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
    # Fixed provisioning bridge before compiled Grease is available.
    - name: Provision immutable compiled Grease and original launcher
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
        ICK_COMPILER: ${{ steps.ick.outputs.compiler }}
      run: |
        mkdir -p "$RUNNER_TEMP/grease/bin"
        gh api repos/dilapidated-shed/grease/actions/artifacts/12192502970/zip > "$RUNNER_TEMP/grease.zip"
        unzip -p "$RUNNER_TEMP/grease.zip" _bin/cxx-asan/ysh > "$RUNNER_TEMP/grease/bin/ysh"
        curl -fL https://github.com/dilapidated-shed/grease/releases/download/tablet-aarch64-9b3dc8904891/grease-aarch64-termux.tar.gz -o "$RUNNER_TEMP/launcher.tar.gz"
        printf '%s  %s\n' 3ddb962ef313e528e525fa03518f494577e921c2201ecb49f7a11f2fbf4e82b2 "$RUNNER_TEMP/launcher.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/launcher.tar.gz" -C "$RUNNER_TEMP/grease" ./bin/grease
        printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c "$RUNNER_TEMP/grease/bin/ysh" | sha256sum -c -
        chmod 755 "$RUNNER_TEMP/grease/bin/ysh"
        printf '%s\n' "$RUNNER_TEMP/grease/bin" >> "$GITHUB_PATH"
        printf 'CC=%s -fno-link-libatomic\nASAN_OPTIONS=detect_leaks=0\n' "$ICK_COMPILER" >> "$GITHUB_ENV"
    - name: Verify exact canonical pin and reject five divergent copies
      shell: sh
      env:
        ASAN_OPTIONS: detect_leaks=0
      run: grease deps/idric-dex/check-pin-self-test.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.deps/android-NDK"
