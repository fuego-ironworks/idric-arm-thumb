name: verify

on:
  push:
    branches: [native-arm]
  pull_request:

concurrency:
  group: arm-thumb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-thumb:
    runs-on: ubuntu-24.04
    env:
      ARM_CLANG: /usr/local/lib/android/sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
    steps:
      - name: Check out exact native-ARM candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned Idriç compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/Idric
          ref: 0e8cfdd1106ebdeffd01b6c519880ea3afc7dc35
          path: Idric

      - name: Check out immutable shared multiplication corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: walnut-burgundy/computer-science
          ref: 32aa3dc5e0e9c2dd19eacb05e515894e252d0886
          path: STAR

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates clang lld file libgmp-dev qemu-user

      - name: Select Android setup without retired tools package
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install pinned NDK assembly and link toolchain
        run: sdkmanager "ndk;29.0.14206865"
      - name: Check exact NDK revision
        run: grep -Fx 'Pkg.Revision = 29.0.14206865' /usr/local/lib/android/sdk/ndk/29.0.14206865/source.properties

      - name: Bootstrap pinned Idriç
        run: |
          ./Idric/edric bootstrap
          printf '%s\n' "$GITHUB_WORKSPACE/Idric/_/.tools/bin" >> "$GITHUB_PATH"

      - name: Install pinned Idriç support, libraries and compiler API
        run: |
          make -C Idric/_ install-support PREFIX="$HOME/.idris2"
          make -C Idric/_ install-bootstrap-libs IDRIS2="$GITHUB_WORKSPACE/Idric/_/build/exec/idris2"
          make -C Idric/_ install-api IDRIS2_BOOT="$GITHUB_WORKSPACE/Idric/_/build/exec/idris2"
          make -C Idric/_ install-support

      - name: Verify native ARM/Thumb numerical, PrintASCII, and branching paths
        run: make verify IDRIC="$GITHUB_WORKSPACE/Idric/_/build/exec/idris2"

      - name: Execute generated Word32 kernels and preserve each defect failure
        run: make mul-word-test IDRIC="$GITHUB_WORKSPACE/Idric/_/build/exec/idris2" ARM_CLANG="$ARM_CLANG" QEMU_ARM=/usr/bin/qemu-arm CORPUS="$GITHUB_WORKSPACE/STAR/integer-multiplication/openai-2026/contracts/mul-v1.tsv"
      - name: Preserve generated word arithmetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-word-arithmetic-evidence
          path: |
            build/exec/word*

      - name: Build screen-red references and execute RGB565 oracle
        run: sh tests/framebuffer/check.sh

      - name: Typecheck all four provenance-preserving corpus fixtures
        env:
          IDRIS2_PATH: ${{ github.workspace }}/build/ttc
        run: ${{ github.workspace }}/Idric/build/exec/idris2 --typecheck tests/real-haskell/fixtures.ipkg

      - name: Install GHC comparison oracle
        run: sudo apt-get install -y ghc
      - name: Create reference benchmark directory
        run: mkdir -p build/real-haskell
      - name: Build the foreign Haskell decision-kernel oracle
        run: ghc -O2 -rtsopts -outputdir build/real-haskell tests/real-haskell/bench/BranchCorpus.hs -o build/real-haskell/branch-corpus
      - name: Run narrow Haskell baseline
        env:
          BENCH_ITERS: 100000
        run: ./build/real-haskell/branch-corpus
