name: verify

on:
  push:
    branches: [native-arm]
  pull_request:

concurrency:
  group: arm-thumb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-thumb:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out backend
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned Idriç compiler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/Idric
          ref: ad674be3e2f0eade5cd007c419a0f0c048548d6a
          path: Idric

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates clang lld file libgmp-dev qemu-user

      - name: Restore the exact pinned host compiler and installed API
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            Idric/.tools
            Idric/build
            Idric/libs/*/build
            ~/.idris2
          key: arm-thumb-host-api-${{ runner.os }}-${{ runner.arch }}-ad674be3e2f0eade5cd007c419a0f0c048548d6a-v1

      - name: Bootstrap pinned Idriç
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: |
          ./Idric/edric bootstrap

      - name: Put the pinned Scheme runtime on PATH
        run: printf '%s\n' "$GITHUB_WORKSPACE/Idric/.tools/bin" >> "$GITHUB_PATH"

      - name: Install pinned Idriç support, libraries and compiler API
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: |
          make -C Idric install-support PREFIX="$HOME/.idris2"
          make -C Idric install-bootstrap-libs IDRIS2="$GITHUB_WORKSPACE/Idric/build/exec/idris2"
          make -C Idric install-api IDRIS2_BOOT="$GITHUB_WORKSPACE/Idric/build/exec/idris2"
          make -C Idric install-support

      - name: Save the pinned host compiler before backend qualification
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            Idric/.tools
            Idric/build
            Idric/libs/*/build
            ~/.idris2
          key: arm-thumb-host-api-${{ runner.os }}-${{ runner.arch }}-ad674be3e2f0eade5cd007c419a0f0c048548d6a-v1

      - name: Verify native ARM/Thumb numerical, PrintASCII, and branching paths
        run: make verify IDRIC="$GITHUB_WORKSPACE/Idric/build/exec/idris2"

      - name: Compile the pinned compiler's signed FP8 source acceptance helper
        run: >-
          Idric/build/exec/idris2 --cg chez
          --source-dir examples/autogenerated/signed-fp8-boundary
          examples/autogenerated/signed-fp8-boundary/CheckBoundaries.idr
          -o check-signed-fp8-boundaries

      - name: Reject ambiguous storage and signed FP8 type interchange
        env:
          IDRIS2_PATH: ${{ github.workspace }}/build/ttc
        run: >-
          build/exec/check-signed-fp8-boundaries
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/exec/idric-arm-thumb"

      - name: Build screen-red references and execute RGB565 oracle
        run: sh tests/framebuffer/check.sh
