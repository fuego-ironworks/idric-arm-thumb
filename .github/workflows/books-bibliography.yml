name: refresh books bibliography

on:
  push:
    branches:
      - books-3sum-apsp-literature
    paths:
      - "books/3sum-apsp-2026/**"
      - ".github/workflows/books-bibliography.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bibliography:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: books-3sum-apsp-literature
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build one-level bibliography
        run: python books/3sum-apsp-2026/bibliography-spider.py

      - name: Commit generated bibliography
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             books/3sum-apsp-2026/one-hop-bibliography.md             books/3sum-apsp-2026/spider-report.json
          if git diff --cached --quiet; then
            echo "Bibliography already current."
            exit 0
          fi
          git commit -m "Generate one-level 3SUM APSP bibliography"
          git push origin HEAD:books-3sum-apsp-literature
